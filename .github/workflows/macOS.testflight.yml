name: macOS Testflight
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Name of the branch"
        required: false
        default: ""

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4
        with:
            repository: saltpi/AriaX
            ref: 'develop'
            token: ${{ secrets.REPO_TOKEN }}
            submodules: recursive
            fetch-depth: 0

      - name: 🔑 Import code sign
        continue-on-error: true
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        
      - name: 📄 Download provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: cn.saltpi.app.AriaX
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 📄 Download provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: cn.saltpi.app.Aria2Helper
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 📄 Download provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: cn.saltpi.app.AriaX.Extension
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 🧱 Install dependencies
        run: |
          brew install xcodegen
          brew install xcbeautify
          ls
          xcodegen
        working-directory: AriaX

      - name: 🔢 Update Build Number
        id: update_build_number
        uses: saltpi/update-testflight-build-number@v5
        with:
          app-id: '6763280346'
          platform: 'MAC_OS'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 🧾 Print Build Number
        run: |
          echo "Build Number: ${{ steps.update_build_number.outputs.build-number }}"
          cat AriaX.xcodeproj/project.pbxproj | grep -A 1 'CURRENT_PROJECT_VERSION = '
        working-directory: AriaX

      - name: ⏰ SPM cache
        uses: actions/cache@v4
        with:
          path: AriaX/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-macOS
          
      - name: 🚀 Build app
        shell: bash
        working-directory: AriaX
        run: |
          # git apply script/macos/*.patch --allow-empty
          next_build_number=$((${{ steps.update_build_number.outputs.build-number }} + 1))
          export BUILD_NUMBER=$next_build_number
          ./script/build_macos.sh
          ls .build/Artifacts

      - name: ☁️ Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: AriaX/.build/Artifacts/AriaX.pkg
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: saltpi/Aria.X
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          tag_name: macos-build-${{ steps.update_build_number.outputs.build-number }}
          name: macOS Build ${{ steps.update_build_number.outputs.build-number }}
          make_latest: true
          body: |
            macOS TestFlight Build ${{ steps.update_build_number.outputs.build-number }}
            
            Build artifacts:
            - AriaX.pkg (TestFlight package)
            - AriaX.dmg (Direct installation)
            
            **Installation Options:**
            1. Use the .pkg file for TestFlight distribution
            2. Use the .dmg file for direct installation
          files: |
            AriaX/.build/Artifacts/AriaX.pkg
            AriaX/.build/Artifacts/AriaX.dmg
            AriaX/.build/Artifacts/appcast.xml
